[package]
name = "rek2_nntp"
version = "1.1.1"
edition = "2024"
authors = ["C.F.N aka ReK2, Hispagatos"]
description = "This is a Rust library that provides a way to interact with NNTP servers, compliant with RFC 3977 and RFC 4643."
license = "GPL-3.0-or-later"
homepage = "https://sr.ht/~rek2/rek2_nntp/"
repository = "https://git.sr.ht/~rek2/rek2_nntp"
documentation = "https://docs.rs/rek2_nntp"
keywords = ["nntp", "usenet"]
categories = ["command-line-utilities", "api-bindings", "network-programming"]
readme = "README.md"

[dependencies]
native-tls = "0.2.14"
bufstream = "0.1.4"
tokio = { version = "1.44", features = ["full"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki = "0.22"
webpki-roots = "0.26"
tokio-native-tls = "0.3.1"
