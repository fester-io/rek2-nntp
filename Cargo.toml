[package]
name = "rek2_nntp"
version = "0.1.1"
edition = "2021"
authors = ["ReK2, Hispagatos"]
description = "This is a Rust library that provides a way to interact with NNTP servers, compliant with RFC 3977 and RFC 4643."
license = "GPL-3.0-or-later"
homepage = "https://git.sr.ht/~rek2/rek2_nntp"
repository = "https://git.sr.ht/~rek2/rek2_nntp"
documentation = "https://git.sr.ht/~rek2/rek2_nntp"
keywords = ["nntp", "usenet"]
categories = ["command-line-utilities", "Internet"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
native-tls = "0.2.7"
bufstream = "0.1.4"
